<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A countdown to Miš meets Miš on August 30, 2026 at 14:30."
    >
    <title>Miš meets Miš</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;650;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css?v=2026082732">
  </head>
  <body>
    <div class="wallpaper" aria-hidden="true">
      <img src="assets/stickers/cuddle.jpeg" alt="">
      <img src="assets/stickers/cheese.jpeg" alt="">
      <img src="assets/stickers/ride.jpeg" alt="">
      <img src="assets/stickers/cuddle.jpeg" alt="">
      <img src="assets/stickers/cheese.jpeg" alt="">
      <img src="assets/stickers/ride.jpeg" alt="">
      <img src="assets/stickers/cuddle.jpeg" alt="">
      <img src="assets/stickers/cheese.jpeg" alt="">
      <img src="assets/stickers/ride.jpeg" alt="">
      <img src="assets/stickers/ride.jpeg" alt="">
      <img src="assets/stickers/cuddle.jpeg" alt="">
      <img src="assets/stickers/cheese.jpeg" alt="">
    </div>
    <div id="heart-rain" class="heart-rain" aria-hidden="true"></div>
    <div id="tap-fireworks" class="tap-fireworks" aria-hidden="true"></div>
    <audio id="background-music" src="assets/again-and-again.mp3" loop preload="metadata"></audio>
    <button id="music-toggle" class="music-toggle" type="button" aria-label="Start background music" title="Start background music">🔈</button>
    <main class="countdown" aria-labelledby="countdown-title">
      <p class="eyebrow">August 30, 2026 · 14:30</p>
      <h1 id="countdown-title">Miš meets Miš in:</h1>

      <section class="timer" aria-label="Countdown timer">
        <div class="time-part">
          <span id="days" class="time-value">0</span>
          <span class="time-label">Days</span>
        </div>
        <div class="time-part">
          <span id="hours" class="time-value">00</span>
          <span class="time-label">Hours</span>
        </div>
        <div class="time-part">
          <span id="minutes" class="time-value">00</span>
          <span class="time-label">Mins</span>
        </div>
        <div class="time-part">
          <span id="seconds" class="time-value">00</span>
          <span class="time-label">Seconds</span>
        </div>
      </section>

      <section class="journey" aria-label="Journey progress">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
          <div id="progress-needle" class="progress-needle" aria-hidden="true">
            <img class="pointer-animation" src="assets/mis-run-white.gif" alt="">
          </div>
          <div class="milestone milestone-start" style="--position: 0%" aria-label="Journey begins">
            <span class="milestone-icon">
              <img class="milestone-art" src="assets/mis-run-white.gif" alt="">
            </span>
          </div>
          <div class="milestone" style="--position: 25%" aria-label="Packing milestone">
            <span class="milestone-icon">
              <img class="milestone-art" src="assets/packmis.gif" alt="">
            </span>
          </div>
          <div class="milestone" style="--position: 50%" aria-label="Flight milestone">
            <span class="milestone-icon">
              <img class="milestone-art milestone-art-mirrored" src="assets/planemis.gif" alt="">
            </span>
          </div>
          <div class="milestone" style="--position: 75%" aria-label="Bus milestone">
            <span class="milestone-icon">
              <img class="milestone-art milestone-art-mirrored" src="assets/busmis.gif" alt="">
            </span>
          </div>
          <div class="milestone milestone-end" style="--position: 100%" aria-label="Arrival milestone">
            <span class="milestone-icon milestone-icon-arrival">
              <img class="milestone-art milestone-art-arrival" src="assets/mis-run-white.gif" alt="">
              <img class="milestone-art milestone-art-arrival milestone-art-wait" src="assets/mis-wait-grey.gif" alt="">
            </span>
          </div>
        </div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite">
        <img class="status-animation" src="assets/cuddle.gif" alt="Two friends cuddling">
      </p>
    </main>

    <script src="script.js?v=2026082723"></script>
  </body>
</html>
